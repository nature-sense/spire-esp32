# Application wisdom corpus: the **spire-idf** component library's documentation
# (its README, its `SPIRE.md`, its `API.md`, and each component's own `README.md`),
# ingested into the user-level KnowledgeStore.
#
# The source is the **embedded `idf/` project itself**: this repository carries the
# library at `idf/`, and `rag_bundle::install_into` writes this manifest with `path`
# resolved to that tree on disk — `__SPIRE_LIBRARY_ROOT__` is the token it replaces.
# Nothing is copied and nothing is fetched, so the corpus follows the library's own
# files: edit `SPIRE.md`, add a component, or write a component's `README.md`, and
# the next ingest picks it up without an entry to maintain here.
#
# It is the one **Spire** corpus in the bundle: the library's own words about
# itself are what a model building *on* it needs, and nothing else holds them.
#
# `SPIRE.md` is the important document of the two, and it travels by two routes
# that do not overlap:
#
#   * **Verbatim, as "library hints".** `idf_projects::library_hints` reads the
#     root `SPIRE.md` of the tree an application is built against and puts it in
#     the fill prompt under "LIBRARY HINTS — … Follow it." That is the
#     authoritative route, and it needs no corpus at all: it is a file read.
#   * **Semantically, as this corpus.** Retrieval is what reaches the document
#     when the model is *not* holding the library's tree — answering a question
#     about how a component is driven, or what the library does and does not
#     provide, from anywhere in the codebase.
#
# So this corpus is the searchable half of a pair whose authoritative half is a
# file. Losing it means "retrieval knows nothing about the library"; losing the
# file means the model is handed a different architecture than the one in the
# tree. Both matter, and neither substitutes for the other.
version: "1.0"
pipeline:
  name: Spire IDF — the ESP-IDF component library's architecture and drivers
  corpus: spire-idf
  settings:
    chunk_size: 1800
    chunk_overlap: 120
    embedding_model: ""
  domains:
    - name: spire-idf
      patterns:
        - "**/*.md"
  sources:
    - id: spire-idf-docs
      type: local
      enabled: true
      # Replaced by `rag_bundle::install_into` with the absolute path of `idf/`.
      # Written here as a token because the manifest ships with the binary and the
      # library's location is a property of the machine, not of the manifest.
      path: __SPIRE_LIBRARY_ROOT__
      processing:
        parser: markdown
        # `include_paths` is matched against the **absolute** path inside the
        # library tree, so every directory pattern needs its `**/` prefix.
        # The set is deliberately **by convention, not by file**:
        #
        #   * `**/SPIRE.md` is the architecture — the library's own statement of
        #     what it provides, how a component is composed, and the build
        #     requirements no component can state for itself.
        #   * `**/README.md` is the orientation, and it deliberately catches
        #     **more than the root one**: every component's `README.md` is its own
        #     documentation, so a component added to the library needs no entry
        #     here.
        #   * `**/API.md` is the function reference: every public type and
        #     function, component by component. It is the half of the library's
        #     documentation a question about *driving* a component needs.
        include_paths:
          - "**/SPIRE.md"
          - "**/README.md"
          - "**/API.md"
        # The tree is the real library, so the globs above would also reach things
        # that are not the library's words about itself:
        #
        #   * `components/lvgl/upstream/**` is the vendored LVGL checkout — its
        #     documentation belongs to the `lvgl` corpus, not to this one.
        #   * `build/**` is CMake/ninja output.
        #   * `main/**` and `tools/**` are the build harness and host tooling, not
        #     the component contract.
        #   * `components/*/test/**` is a component's host test tree.
        exclude_paths:
          - "**/components/lvgl/upstream/**"
          - "**/build/**"
          - "**/main/**"
          - "**/tools/**"
          - "**/components/*/test/**"
