name: ft6336
kind: driver
description: 'A FocalTech FT6336 capacitive touch controller: one touch point, read register by register over I2C.'
invariants:
- it owns its bus handle and takes no board facts — pins, ports and the address are the application's
- it reaches the bus through bus_write / bus_read / bus_write_read and nothing else
- it reports failure by returning false, never by logging
- status 0 is a successful read with no finger, not a failure
- a coordinate is twelve bits, high nibble first
device:
  part: ft6336
  bus: i2c
provides:
- media.touch
facts:
- corpus: device-facts
  source: ft6336.md
